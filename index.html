<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
:root{
  --bg:#EEF4F6;--surface:#FFFFFF;--surface-2:#F6F9FA;--ink:#11262B;--muted:#5B6F74;--line:#DCE6E8;
  --brand:#008BA5;--brand-hover:#00758C;--brand-soft:#E0F2F5;--on-brand:#FFFFFF;--navy:#2B557A;
  --mint:#CEF3E4;--peach:#FBE3DA;--ok:#14935A;--ok-soft:#DFF5E9;--bad:#D23F3F;--bad-soft:#FCE6E6;--warn:#B8740F;--warn-soft:#FCF0DC;
  --t1:#E2F6EE;--t1i:#16A37B;--t2:#E5F0FB;--t2i:#2F7DE1;--t3:#FDEEDF;--t3i:#E99A2C;--t4:#EFEAFC;--t4i:#8B5CF0;
  --sb1:#0B5967;--sb2:#083845;--sb-ink:#E3F2F5;--sb-muted:#8DB9C2;
  --shadow:0 1px 2px rgb(17 38 43 / .05),0 6px 18px rgb(17 38 43 / .05);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1416;--surface:#132125;--surface-2:#182A2F;--ink:#E3EEF0;--muted:#91A6AB;--line:#24373C;
  --brand:#27B3CC;--brand-hover:#4CC4DA;--brand-soft:#123A42;--on-brand:#06181C;--navy:#7FA7CC;
  --mint:#173F35;--peach:#3E2A22;--ok:#4CCB8A;--ok-soft:#163528;--bad:#F07A7A;--bad-soft:#3B1E1E;--warn:#EDB458;--warn-soft:#3A2D16;
  --t1:#15302A;--t1i:#3DD1A2;--t2:#16273A;--t2i:#6FA8F0;--t3:#36291A;--t3i:#F0B55E;--t4:#251F3C;--t4i:#A88AF5;
  --sb1:#082A31;--sb2:#051B21;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1416;--surface:#132125;--surface-2:#182A2F;--ink:#E3EEF0;--muted:#91A6AB;--line:#24373C;
  --brand:#27B3CC;--brand-hover:#4CC4DA;--brand-soft:#123A42;--on-brand:#06181C;--navy:#7FA7CC;
  --mint:#173F35;--peach:#3E2A22;--ok:#4CCB8A;--ok-soft:#163528;--bad:#F07A7A;--bad-soft:#3B1E1E;--warn:#EDB458;--warn-soft:#3A2D16;
  --t1:#15302A;--t1i:#3DD1A2;--t2:#16273A;--t2i:#6FA8F0;--t3:#36291A;--t3i:#F0B55E;--t4:#251F3C;--t4i:#A88AF5;
  --sb1:#082A31;--sb2:#051B21;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sb1)}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;align-self:start;background:linear-gradient(180deg,var(--sb1),var(--sb2));color:var(--sb-ink);display:flex;flex-direction:column;padding:26px 16px 18px;overflow:hidden;border-radius:0 26px 26px 0;z-index:20}
.sb::after{content:"";position:absolute;left:-30px;bottom:-30px;width:240px;height:200px;background-image:radial-gradient(rgb(255 255 255 / .14) 1.6px,transparent 1.8px);background-size:16px 16px;pointer-events:none;mask:linear-gradient(20deg,#000,transparent 75%)}
.sb-logo{display:block;padding:0 10px 18px;border-bottom:1px solid rgb(255 255 255 / .14);margin-bottom:16px;cursor:pointer;border:0;background:none;text-align:left}
.sb-logo img{width:172px;height:auto;display:block}
.sb-sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-muted);padding:10px 12px 6px}
.sb-nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;position:relative;z-index:1;scrollbar-width:thin}
.sb-nav button,.sb-foot button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--sb-ink);padding:10px 14px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:500}
.sb-nav button:hover,.sb-foot button:hover{background:rgb(255 255 255 / .08)}
.sb-nav button.on{background:linear-gradient(90deg,#16A6BC,#0A8CA3);box-shadow:0 6px 16px rgb(0 0 0 / .18);color:#fff}
.sb-nav .count{margin-left:auto}
.sb-foot{border-top:1px solid rgb(255 255 255 / .14);padding-top:12px;margin-top:10px;position:relative;z-index:1}
.sb-foot .who{padding:6px 14px 10px;font-size:13px;color:var(--sb-muted);line-height:1.35}
.sb-foot .who b{display:block;color:var(--sb-ink);font-size:14px;font-weight:600}
.count{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#F2A531;color:#2A1A00;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.main{min-width:0;padding:28px 32px 64px}
.wrap{max-width:1240px;margin:0 auto}
.mtop{display:none}
.backdrop{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:clamp(24px,3.2vw,30px);line-height:1.15}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:72ch}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--surface);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:236px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero-copy{padding:32px 34px;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero-copy h1{font-size:clamp(26px,3.4vw,36px);line-height:1.1}
.hero-copy p{margin:10px 0 20px;color:var(--muted);font-size:16px;max-width:44ch}
.hero-img{position:relative;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);background:center/cover no-repeat}
.hero-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(0 0 0 / .05),transparent 40%)}
.hero-swoosh{position:absolute;top:0;bottom:0;left:calc(50% - 4.4%);width:9%;z-index:1;background:linear-gradient(180deg,#27C3D6,#008BA5);clip-path:polygon(78% 0,100% 0,22% 100%,0 100%);opacity:.95}
.hero.slim{min-height:180px}
.hero-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:5px 11px;border-radius:20px;align-self:flex-start;margin-bottom:12px}

/* ---------- cards & kpis ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.mt{margin-top:18px}.mt2{margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;display:flex;align-items:center;gap:10px}
.card h2 svg.i{color:var(--brand);width:22px;height:22px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.kpi{border-radius:20px;padding:18px 20px;position:relative;overflow:hidden;border:1px solid var(--line);min-width:0}
.kpi::after{content:"";position:absolute;right:-40px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgb(255 255 255 / .35)}
.kpi .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-bottom:12px;position:relative;z-index:1}
.kpi .ico svg.i{width:22px;height:22px}
.kpi b{display:block;font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.kpi .row{justify-content:space-between;position:relative;z-index:1;margin-top:4px}
.kpi span.l{color:var(--ink);opacity:.82;font-size:15px}
.k1{background:var(--t1)}.k1 .ico{background:var(--t1i)}.k2{background:var(--t2)}.k2 .ico{background:var(--t2i)}
.k3{background:var(--t3)}.k3 .ico{background:var(--t3i)}.k4{background:var(--t4)}.k4 .ico{background:var(--t4i)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi::after{background:rgb(255 255 255 / .04)}}
:root[data-theme="dark"] .kpi::after{background:rgb(255 255 255 / .04)}
.trend{font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface);white-space:nowrap}
.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}.trend.flat{color:var(--muted)}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);display:flex;gap:12px;align-items:flex-start;min-width:0}
.tile .ti{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.tile span{display:block;font-size:13.5px;color:var(--muted)}
.tile b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.conv{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.conv .row{justify-content:space-between;font-size:13.5px}
.conv .row b{font-variant-numeric:tabular-nums}
.cbar{height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.cbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#1FAE4E,#14935A)}

/* ---------- referral link ---------- */
.linkbox{display:flex;gap:12px;align-items:stretch}
.linkfield{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px}
.linkfield span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:7px 14px;font-weight:500;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14.5px}
.pill:hover{border-color:var(--brand)}
.pill svg.i{width:18px;height:18px}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%;padding:12px;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 2px;font-size:14.5px}
.linkbtn:hover{text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);flex:1;min-width:160px}
.field input,.field select,.field textarea,.sel{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%}
.field textarea{min-height:90px;resize:vertical}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14.5px}
.check input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--brand)}
.err{color:var(--bad);font-size:14px;margin:12px 0 0;min-height:1em}
.otp{font-size:24px;letter-spacing:.32em;text-align:center}
td input,td select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:140px}

/* ---------- chips, tables, lists ---------- */
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:13px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13.5px}
.notice{background:var(--warn-soft);border-radius:14px;padding:14px 18px;font-size:14.5px;margin-bottom:16px}
.notice.info{background:var(--brand-soft)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px;margin:12px 0}
.kv span{color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.list li:last-child{border-bottom:0}
.list .rank{font-weight:700;font-size:18px;width:30px;color:var(--muted)}
.list li.me{background:var(--brand-soft);margin:0 -12px;padding:11px 12px;border-radius:10px}
.msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px;margin:12px 0}
.mini{width:100%;font-size:13px;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mini td,.mini th{padding:7px 9px}

/* ---------- referral trail ---------- */
.refs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ref{border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;background:var(--surface)}
.ref-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ref-head strong{font-size:16px}
.ref-sub{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.trail{display:flex;align-items:center;margin:16px 4px 24px}
.step{flex:1;display:flex;align-items:center;position:relative}
.step::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line);margin:0 3px}
.step.lit::after{background:var(--brand)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;position:relative}
.done .dot{background:var(--brand);border-color:var(--brand)}
.current .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.trail.stopped .current .dot{border-color:var(--bad);background:var(--bad);box-shadow:none}
.lbl{position:absolute;top:19px;left:-4px;font-size:12px;color:var(--muted);white-space:nowrap}
.current .lbl{color:var(--ink);font-weight:600}
.coin{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px dashed var(--line);color:var(--muted);position:relative}
.coin.due{border-color:var(--t3i);color:var(--t3i)}
.coin.half{border:2px solid var(--t3i);color:var(--t3i);background:linear-gradient(90deg,var(--t3) 50%,transparent 50%)}
.coin.paid{background:var(--t3i);border:2px solid var(--t3i);color:#fff}
.coin.void{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.coin .lbl{left:auto;right:-6px;top:34px}
@media (max-width:760px){.lbl{display:none}.trail{margin-bottom:8px}}

/* ---------- slabs, gauge ---------- */
.slab{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.slab-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.slab-top h3{font-size:18px;display:flex;align-items:center;gap:8px}
.slab-top h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.slab-rate{text-align:right}.slab-rate b{display:block;font-size:20px;color:var(--t3i)}.slab-rate span{font-size:12px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 6px}
.seg{height:9px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--brand)}
.seg.cur{border-color:var(--t3i)}.seg.cur i{background:var(--t3i)}
.seglbl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--muted)}
.seglbl b{display:block;color:var(--ink);font-weight:600}
.slab p{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.gauge{display:block;width:100%;max-width:320px;margin:0 auto}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- funnel bars ---------- */
.frow{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar{height:14px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.frow b{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- public pages ---------- */
.pubtop{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-wrap:wrap}
.pubtop img{height:40px;width:auto;display:block}
.logo-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}:root[data-theme="dark"] .logo-d{display:block!important}
.pub{max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 64px}
.narrow{max-width:600px;margin:0 auto}
.authbox{max-width:470px;margin:0 auto}
.authbox .field,.narrow .field{margin-top:14px}
.stepno{font-size:13.5px;color:var(--brand);font-weight:600;margin:0 0 4px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.type{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:block;background:var(--surface)}
.type input{position:absolute;opacity:0;pointer-events:none}
.type b{display:block;font-size:15px;color:var(--ink)}
.type span{font-size:13px;color:var(--muted)}
.type:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-soft)}
.type:has(input:disabled){opacity:.5;cursor:not-allowed}
.type:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.howto .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:700;margin-bottom:12px}
.bigrate{font-size:clamp(34px,5vw,52px);font-weight:700;color:var(--brand);line-height:1}
.success-ico{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.payload{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre;margin:10px 0 0}
details summary{cursor:pointer;font-weight:600;font-size:14.5px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--surface-2);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.demo select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.checklist{list-style:none;padding:0;margin:16px 0 0}
.checklist li{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:15px}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);flex:none}
.checklist .ok .ck{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.checklist .now .ck{border-color:var(--t3i);color:var(--t3i)}
.checklist .now{font-weight:600}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.thread{display:grid;gap:10px;margin:14px 0}
.bubble{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface-2);font-size:14.5px}
.bubble.staff{background:var(--brand-soft)}
.bubble small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
dialog{border:1px solid var(--line);border-radius:20px;padding:0;width:calc(100% - 32px);max-width:440px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(5 20 24 / .55)}
.dlg{padding:24px}
.dlg .qrbig{width:240px;height:240px;margin:14px auto;background:#fff;padding:12px;border-radius:14px;border:1px solid var(--line)}
.qrbig svg{width:100%;height:100%;display:block}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:14.5px;max-width:calc(100% - 32px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.phonerow{display:flex;gap:8px}.phonerow select{flex:0 0 auto;width:150px;max-width:44%}.phonerow input{flex:1;min-width:0}
.ptop{display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px}
.bellbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:7px 14px;cursor:pointer;font-weight:500}
.bellbtn:hover{border-color:var(--brand)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.cover{position:relative;height:140px;background-size:cover;background-position:center;color:#fff;display:flex;align-items:flex-end;padding:14px}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--cc) 0%,color-mix(in srgb,var(--cc) 55%,transparent) 55%,rgb(0 0 0 / .25) 100%)}
.cover b{position:relative;font-size:24px;font-weight:700;letter-spacing:-.01em;text-shadow:0 1px 8px rgb(0 0 0 / .25)}
.cover .newb{position:absolute;top:12px;right:12px;z-index:1;background:#fff;color:#0B5967;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.cover.big{height:220px;border-radius:20px;padding:24px}.cover.big b{font-size:34px}
.ccard .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard h3{font-size:17px}
.ccard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.ccard .earn{font-size:14px;color:var(--t3i);font-weight:600}
.ccard .row.end{margin-top:auto}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.rthumb{height:130px;display:grid;place-items:center;color:#fff;position:relative;background-size:cover;background-position:center}
.rthumb::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 40%,#06222A))}
.rthumb.img::before{display:none}
.rthumb svg.i{position:relative;width:34px;height:34px}
.rthumb .rtext{position:relative;padding:14px;font-size:13px;line-height:1.45;max-height:100%;overflow:hidden;text-align:left;align-self:stretch}
.rthumb .newb{position:absolute;top:10px;right:10px;background:#fff;color:#0B5967;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;z-index:1}
.rcard .rb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.rcard h3{font-size:15.5px;line-height:1.3}
.rcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.rcard .row.end{margin-top:auto}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);text-decoration:none}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn svg.i{width:18px;height:18px}
.selrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.selrow select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:150px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.nlist{list-style:none;margin:12px 0 0;padding:0;max-height:60vh;overflow-y:auto}
.nlist li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.nlist .ud{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.nlist .ud.r{background:transparent}
.thumbsm{width:56px;height:40px;border-radius:8px;background-size:cover;background-position:center;flex:none;position:relative;overflow:hidden}
.thumbsm::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--cc),transparent)}
.dlg.wide{max-width:none}
dialog.wide{max-width:640px}
.prevbox{border-radius:14px;overflow:hidden;margin:12px 0}
.hero-copy h1 .subline{display:block;margin-top:10px;font-size:.52em;font-weight:500;line-height:1.3;color:var(--muted);letter-spacing:0}
.why{display:flex;flex-direction:column;gap:12px;justify-content:center}
.why h3{font-size:17px;line-height:1.3}
.why .wi{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.joinband{background:var(--hero,#0B5967);background:linear-gradient(135deg,#0B5967,#008BA5);color:#fff;border-radius:24px;padding:clamp(24px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.joinband h2{font-size:clamp(24px,3vw,32px)}
.joinband p{margin:8px 0 0;max-width:52ch;opacity:.92;font-size:16px}
.btn.on-band{background:#fff;color:#0B5967;border-color:#fff}
.stickycta,.stickyspace{display:none}
@media (max-width:720px){.stickyspace{display:block;height:72px}.stickycta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}.stickycta .btn{width:100%;padding:13px}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-7-5{grid-template-columns:1fr}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-105%);transition:transform .22s;padding-top:calc(26px + env(safe-area-inset-top,0px))}
  .sb.open{transform:none}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgb(5 20 24 / .5);z-index:15}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--sb1);padding:10px 16px;color:#fff}
  .mtop img{height:32px;width:auto}
  .mtop button{border:0;background:rgb(255 255 255 / .12);color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
  .main{padding:20px 16px 56px}
  .hero{grid-template-columns:1fr}
  .hero-img{min-height:170px;clip-path:polygon(0 12%,100% 0,100% 100%,0 100%);order:-1}
  .hero-swoosh{display:none}
  .g3{grid-template-columns:1fr}
}
@media (max-width:620px){
  .g4,.g2{grid-template-columns:1fr 1fr}
  .kpi{padding:14px}.kpi .ico{width:36px;height:36px;margin-bottom:8px}
  .linkbox{flex-direction:column}
  .types,.legend{grid-template-columns:1fr}
  .frow{grid-template-columns:100px 1fr 38px}
  .hero-copy{padding:22px}
}
@media (max-width:420px){.g4,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.sb,.toast{transition:none}}
</style>

/* ---------- configuration, Supabase client and data layer ---------- */
const CFG=window.AIMER_CONFIG||{};
const siteBase=()=>(CFG.siteUrl||location.origin).replace(/\/$/,'');
const sb=(window.supabase&&CFG.url&&CFG.key)?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const FRIENDLY={'Invalid login credentials':'That email or password isn’t right.','Email not confirmed':'Please confirm your email first. Check your inbox for our message.',
  'User already registered':'An account with this email already exists. Log in instead.','New password should be different from the old password.':'Choose a password you haven’t used before.',
  'Password should be at least 6 characters.':'Use at least 8 characters for your password.','Failed to fetch':'We couldn’t reach the server. Check your connection and try again.'};
const errOf=e=>{const m=(e&&e.message)||String(e);return new Error(FRIENDLY[m]||m.replace(/^FunctionsHttpError:?\s*/,''))};
const SIGNED_CACHE={};
const DB={
  async select(table,o={}){let q=sb.from(table).select(o.cols||'*');for(const[k,v]of Object.entries(o.eq||{}))q=q.eq(k,v);for(const[k,v]of Object.entries(o.in||{}))q=q.in(k,v);
    if(o.order)q=q.order(o.order,{ascending:o.asc===true});q=q.limit(o.limit||1000);const{data,error}=await q;if(error)throw errOf(error);return data||[]},
  async one(table,o={}){const r=await DB.select(table,{...o,limit:1});return r[0]||null},
  async rpc(name,args){const{data,error}=await sb.rpc(name,args||{});if(error)throw errOf(error);return data},
  async insert(table,row){const{data,error}=await sb.from(table).insert(row).select();if(error)throw errOf(error);return data},
  async update(table,patch,eq){let q=sb.from(table).update(patch);for(const[k,v]of Object.entries(eq))q=q.eq(k,v);const{data,error}=await q.select();if(error)throw errOf(error);return data},
  async del(table,eq){let q=sb.from(table).delete();for(const[k,v]of Object.entries(eq))q=q.eq(k,v);const{error}=await q;if(error)throw errOf(error)},
  async remove(bucket,paths){try{await sb.storage.from(bucket).remove(paths)}catch(e){}},
  async upsert(table,row,conflict){const{data,error}=await sb.from(table).upsert(row,{onConflict:conflict}).select();if(error)throw errOf(error);return data},
  async upload(bucket,path,file){const{error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type||undefined});if(error)throw errOf(error);return path},
  publicUrl(bucket,path){return path?sb.storage.from(bucket).getPublicUrl(path).data.publicUrl:null},
  async signed(bucket,paths){const out={},now=Date.now(),need=[];   // links last an hour, so reuse them until 10 minutes before they expire
    for(const p of paths){const c=SIGNED_CACHE[bucket+'/'+p];if(c&&c.exp>now+600000)out[p]=c.url;else need.push(p)}

    J.busy=true;J.busyMsg='';render();
    const instant=!(S.catalog&&S.catalog.email_confirmation_required),email=d.email.trim().toLowerCase();
    const slow=setTimeout(()=>{if(J.busy){J.busyMsg=instant?'Still working… please keep this page open.':'Still working… sending your confirmation email can take a few seconds.';render()}},5000);
    const enter=async()=>{J.busy=false;J.d.pw=J.d.pw2='';S.booting=true;render();await boot();S.booting=false;routeAfterLogin();render(true)};
    try{
      if(instant){
        const r=await withTimeout(DB.register({name:d.name.trim(),phone:e164,email,password:d.pw,country:d.country||'',category:d.cat||'Student',note:(d.note||'').trim()}),30000,'timeout').catch(()=>({fallback:true}));
        if(!r.ok&&!r.fallback)throw new Error(r.error);
        let signed=false;   // after a timeout the account may already exist, so try signing in before using the email route
        try{J.busyMsg='Signing you in…';render();await withTimeout(DB.auth.signIn(email,d.pw),25000,'timeout');signed=true}catch(_){}
        if(signed){clearTimeout(slow);await enter();return}
        if(r.ok){clearTimeout(slow);J.busy=false;J.d.pw=J.d.pw2='';S.ui.lemail=email;S.view='login';render(true);toast('Your account is ready. Log in with your email and password.');return}
      }
      const chk=await withTimeout(DB.rpc('check_signup',{p_phone:e164,p_email:d.email,p_category:d.cat}),20000,'We couldn’t reach the server. Check your connection and try again.');
      if(chk==='employee_email_required')throw new Error('Employees sign up with their official AIMER email'+(empDomains().length?' ('+empDomains().join(' or ')+')':'')+'. Choose another category if you’re not AIMER staff.');
      if(chk==='phone_taken')throw new Error('This mobile number is already registered. Log in instead.');
      if(chk==='email_taken')throw new Error('An account with this email already exists. Log in instead.');
      const res=await withTimeout(DB.auth.signUp(email,d.pw,{account_type:'partner',full_name:d.name.trim(),phone:e164,country:d.country||'',category:d.cat||'Student',category_note:(d.note||'').trim()}),45000,'This is taking longer than usual. Your account may already be created, so check your email, or try logging in.');
      clearTimeout(slow);J.busy=false;J.d.pw=J.d.pw2='';
      if(res.session){S.booting=true;render();await boot();S.booting=false;routeAfterLogin();render(true)}else{J.step='confirm';render(true)}
    }catch(e){clearTimeout(slow);J.busy=false;J.err=e.message;render()}},

  bapprove:async e=>{if(deny('approve'))return;await DB.rpc('decide_payout_batch',{p_batch:S.batches.find(x=>x.id===e.dataset.id).uid,p_approve:true});await refresh();toast('Batch approved for transfer')},
  breturn:async e=>{if(deny('approve'))return;await DB.rpc('decide_payout_batch',{p_batch:S.batches.find(x=>x.id===e.dataset.id).uid,p_approve:false});await refresh();toast('Batch sent back')},
  /* ----- course catalogue ----- */
  cedit:e=>{S.ui.ced=e.dataset.id;S.ui.pendingImg=null;render(true)},
  cedclose:()=>{S.ui.ced=null;render(true)},
  csave:async e=>{if(deny('courses'))return;const isN=S.ui.ced==='new',name=v('ce-name').trim(),code=isN?v('ce-code').trim():e.dataset.id;
    if(!code||!name)return toast('Add a course code and name');if(isN&&course(code))return toast('That course code already exists');if(isN&&!/^[A-Za-z0-9][A-Za-z0-9 \-]{1,19}$/.test(code))return toast('Use 2 to 20 letters, numbers, spaces or hyphens for the code');
    const cats=[...CATS,'Event organizer'].filter((x,i)=>document.getElementById('ce-cat'+i).checked),broF=document.getElementById('ce-bro').files[0],imgF=document.getElementById('ce-img').files[0],old=isN?null:course(code);
    const row={name,short_description:v('ce-short').trim()||name,description:v('ce-desc').trim(),eligibility:v('ce-elig').trim(),duration:v('ce-dur').trim(),fee:parseInt(v('ce-fee'),10)||0,mode:v('ce-mode').trim(),
      benefits:v('ce-ben').split('\n').map(x=>x.trim()).filter(Boolean),landing_url:v('ce-land').trim(),color:v('ce-col'),referral_eligible:document.getElementById('ce-ref').checked,eligible_categories:cats};
    const folder=slugOf(code);if(imgF)row.image_path=await DB.upload('course-media',`courses/${folder}/cover-${Date.now()}.${fileExt(imgF)}`,imgF);if(broF)row.brochure_path=await DB.upload('course-media',`courses/${folder}/brochure-${Date.now()}.pdf`,broF);
    let id;
    if(isN){const [c]=await DB.insert('courses',{...row,code,status:'Draft',created_by:S.session.id});id=c.id;
      const rates=[0,1,2,3].map(i=>parseInt(v('ce-r'+i),10)||0);
      if(rates.some(x=>x>0))await DB.rpc('request_approval',{p_type:'policy',p_summary:'Incentive rates for new course '+name,p_payload:{rates:{[id]:rates},note:'New course added to the catalogue'}})}
    else{id=old.uid;await DB.update('courses',row,{id});const rn=document.getElementById('ce-rcode');if(rn&&rn.value.trim()&&rn.value.trim()!==old.code)await DB.rpc('rename_course_code',{p_course:id,p_code:rn.value.trim()})}
    const finalCode=(!isN&&document.getElementById('ce-rcode')&&document.getElementById('ce-rcode').value.trim())||code;
    for(const [i,x] of S.camps.filter(x=>x.kind==='programme'&&!['Closed','Rejected'].includes(x.status)).entries()){const el=document.getElementById('ce-cmp'+i);if(!el)continue;const has=x.progs.includes(code);
      if(el.checked&&!has)await DB.insert('campaign_courses',{campaign_id:x.uid,course_id:id});if(!el.checked&&has)await DB.del('campaign_courses',{campaign_id:x.uid,course_id:id})}
    let n=0;if(e.dataset.launch){n=await DB.rpc('set_course_status',{p_course:id,p_status:'Active'})}else if(!isN&&old.status==='Active'){n=await DB.rpc('announce_course',{p_course:id})}
    S.ui.ced=null;await refresh(true);toast(e.dataset.launch?(n?`${name} launched. ${n} eligible partners notified.`:`${name} is active. Partners are notified once it’s in an active campaign.`):n?`${name} is now open for referrals. ${n} eligible partners notified.`:isN?'Course saved as a draft':'Course updated')},
  cstat:async e=>{if(deny('courses'))return;const c=course(e.dataset.id),to=e.dataset.v;if(to==='Archived'&&!confirm(`Archive ${c.name}? It disappears from partner pages and new referral forms. Existing leads and incentives stay.`))return;
    const n=await DB.rpc('set_course_status',{p_course:c.uid,p_status:to});await refresh();toast(n?`${c.name} launched. ${n} eligible partners notified.`:`${c.name}: ${to.toLowerCase()}`)},
  /* ----- resource centre ----- */
  radd:async()=>{if(deny('materials'))return;const type=v('ru-type'),title=v('ru-title').trim(),f=document.getElementById('ru-file').files[0],text=v('ru-text').trim(),isTxt=['WhatsApp message','Social caption'].includes(type);
    if(!title)return toast('Add a title');if(isTxt&&!text)return toast('Add the message or caption text');if(!isTxt&&!f)return toast('Choose a file to upload');
    let path=null,thumb=null;if(!isTxt){path=await DB.upload('resources',`${slugOf(type)}/${Date.now()}-${safeName(f)}`,f);if(/^image\//.test(f.type))thumb=path}
    const cc=course(v('ru-course')),cm=camp(v('ru-camp'));
    const [r]=await DB.insert('resources',{type,title,course_id:cc?cc.uid:null,campaign_id:cm?cm.uid:null,language:v('ru-lang'),file_path:path,thumb_path:thumb,body_text:isTxt?text:null,status:'Draft',created_by:S.session.id});
    const n=await DB.rpc('publish_resource',{p_resource:r.id,p_notify:document.getElementById('ru-notify').checked});await refresh();toast(n?`Published. ${n} partners notified.`:'Published')},
  rtoggle:async e=>{if(deny('materials'))return;const r=S.resources.find(x=>x.id===e.dataset.id);await DB.update('resources',{status:r.status==='Published'?'Unpublished':'Published'},{id:r.id});await refresh()},
  rdel:async e=>{if(deny('materials'))return;const r=S.resources.find(x=>x.id===e.dataset.id);if(!confirm(`Delete “${r.title}”? Usage history for it is removed too.`))return;await DB.del('resources',{id:r.id});if(r.filePath)DB.remove('resources',[r.filePath]);await refresh()},
  nadd:async()=>{if(deny('materials'))return;const t=v('an-title').trim(),b=v('an-body').trim();if(!t||!b)return toast('Add a title and message');const n=await DB.rpc('post_announcement',{p_title:t,p_body:b});await refresh();toast(`Announcement sent to ${n} partners`)},
  ndel:async e=>{if(deny('materials'))return;await DB.rpc('delete_notification',{p_id:e.dataset.id});await refresh()},
  csv:e=>{const rows=CSV[e.dataset.k]();return copyText(rows.map(r=>r.join('\t')).join('\n')).then(()=>toast(`Copied ${rows.length-1} rows. Paste into Excel.`))},
  /* ----- roles, settings, integrations ----- */
  atoggle:async e=>{if(deny('admins'))return;const a=S.admins.find(x=>x.id===e.dataset.id);await DB.update('admin_users',{status:a.status==='Active'?'Deactivated':'Active'},{user_id:a.id});await refresh()},
  addadmin:async()=>{if(deny('admins'))return;await DB.invoke('admin-partners',{action:'invite_admin',full_name:v('na-name').trim(),email:v('na-email').trim(),role:v('na-role')});await refresh();toast('Invitation sent. They set their own password from the email.')},
  lsqtest:async()=>{if(deny('settings'))return;const r=await DB.invoke('lsq-admin',{action:'test'});await loadLsqStatus();await refresh();toast(r.message)},
  savesettings:async()=>{if(deny('settings'))return;const days=parseInt(v('st-days'),10);if(!(days>0))return toast('Enter a valid attribution window');
    const counsellors=v('st-couns').split('\n').map(x=>x.trim()).filter(Boolean),now=new Date().toISOString();
    await DB.upsert('app_settings',[{key:'require_phone_otp',value:document.getElementById('st-otp').checked,updated_at:now},{key:'email_confirmation_required',value:document.getElementById('st-emailconf').checked,updated_at:now},{key:'attribution_window_days',value:days,updated_at:now},{key:'public_show_rates',value:document.getElementById('st-rates').checked,updated_at:now},{key:'counsellors',value:counsellors,updated_at:now}],'key');await refresh();toast('Settings saved')},
  savemap:async()=>{if(deny('settings'))return;const map={};
    for(const [k,l,d,ex,req,defOn,kind] of LSQ_FIELDS){const f=v('lm-'+k).trim();if(!/^[A-Za-z][A-Za-z0-9_]{0,60}$/.test(f))return toast(`“${l}”: use the LeadSquared schema name, letters, numbers and underscores only`);
      const e={field:f,on:!!req||document.getElementById('lc-'+k).checked};if(kind==='fixed')e.value=v('lv-'+k).trim();if(kind==='source'){e.value=v('lv-'+k).trim();e.web=v('lw-'+k).trim()}
      if(kind==='fixed'&&e.on&&!e.value)return toast(`“${l}” is switched on but has no value`);map[k]=e}
    const used=Object.entries(map).filter(([k,e])=>e.on).map(([k,e])=>e.field.toLowerCase()),dup=used.find((f,i)=>used.indexOf(f)!==i);if(dup)return toast(`Two fields go to “${dup}”. Each LeadSquared field can be used once.`);
    await DB.upsert('app_settings',{key:'lsq_field_map',value:map,updated_at:new Date().toISOString()},'key');await refresh();toast('Field mapping saved. It applies to the next lead.')},
  resetmap:async()=>{if(deny('settings'))return;if(!confirm('Reset every field to the default names?'))return;await DB.upsert('app_settings',{key:'lsq_field_map',value:{},updated_at:new Date().toISOString()},'key');await refresh();toast('Field mapping reset')},
  retry:async e=>{const r=await DB.invoke('lsq-admin',{action:'sync',referral_id:e.dataset.id});await refresh();toast(r.failed?r.message:'Synced to LeadSquared')},
  retryall:async()=>{const r=await DB.invoke('lsq-admin',{action:'sync'});await refresh();toast(r.failed?`${r.synced} sent, ${r.failed} still waiting. ${r.message}`:`${r.synced} leads sent to LeadSquared`)}
};
/* ----- events ----- */
document.addEventListener('click',e=>{const a=e.target.closest('a[data-track]');if(a&&meId())track(meId(),a.dataset.track,'share');
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='A'||t.disabled)return;const fn=A[t.dataset.act];if(!fn)return;
  const lock=t.dataset.lock!=='no';if(lock)t.disabled=true;
  Promise.resolve().then(()=>fn(t)).catch(err=>{toast((err&&err.message)||'Something went wrong. Please try again.');if(S.session)render()}).finally(()=>{if(lock&&document.body.contains(t))t.disabled=false})});
document.addEventListener('input',capture);
document.addEventListener('change',e=>{capture(e);const k=e.target.dataset.change;if(!k)return;
  if(k==='jcat'){J.d.cat=e.target.value;J.err='';render()}
  else if(k==='assign'){if(deny('lead.update'))return render();const r=S.refs.find(x=>x.id===e.target.dataset.id);DB.rpc('assign_counsellor',{p_referral:r.uid,p_counsellor:e.target.value}).then(()=>refresh()).then(()=>toast('Counsellor updated')).catch(er=>{toast(er.message);render()})}
  else if(k==='arole'){if(deny('admins'))return render();const a=S.admins.find(x=>x.id===e.target.dataset.id);DB.update('admin_users',{role:e.target.value},{user_id:a.id}).then(()=>refresh()).then(()=>toast('Role updated')).catch(er=>{toast(er.message);render()})}
  else if(k==='ceimg'){const f=e.target.files&&e.target.files[0];const pv=document.getElementById('ce-prev');if(f&&pv)pv.style.backgroundImage=`url(${URL.createObjectURL(f)})`}
  else if(k==='ruimg'){}
  else{S.ui[k]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['checkbox','radio','file'].includes(e.target.type)){if(e.target.dataset.change){e.target.blur();return}const box=e.target.closest('.card,.authbox,.narrow');const b=box&&box.querySelector('.btn.primary[data-act]');if(b&&!b.disabled){e.preventDefault();b.click()}}
  if(e.key==='Escape'&&S.ui.sb){S.ui.sb=false;render()}});
window.addEventListener('popstate',()=>{if(S.session)return;const r=viewFromUrl();if(r.view==='register')openRefPage(r.code,r.course,r.res);else{S.view=r.view;render()}});

/* ----- start ----- */
async function appInit(){
  if(!sb&&!window.__NO_AUTO_INIT){$('root').innerHTML=`<div class="pub"><div class="card" style="max-width:520px;margin:60px auto"><h1 style="font-size:24px">This copy isn’t connected</h1><p class="muted">The app can’t reach AIMER’s servers. Open it from the hosted address (for example https://aimer-portal.netlify.app) rather than from a file or preview, and make sure <code>config.js</code> sits next to <code>index.html</code> in the hosted folder.</p></div></div>`;return}
  const hashType=new URLSearchParams((location.hash||'').replace(/^#/,'')).get('type');
  S.booting=true;render();
  const r=viewFromUrl();await loadCatalog();
  if(S.connErr&&/api key|jwt|apikey|fetch|network|failed to/i.test(S.connErr)){$('root').innerHTML=`<div class="pub"><div class="card" style="max-width:540px;margin:60px auto"><h1 style="font-size:24px">We can’t reach AIMER’s servers</h1><p class="muted">${/api key|jwt|apikey/i.test(S.connErr)?'The app’s connection key is wrong or has been changed. Please tell the AIMER team: check the key in <code>config.js</code>.':'Check your internet connection and try again.'}</p><p class="small muted">Detail: ${esc(S.connErr)}</p><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`;return}
  if(sb){DB.auth.onChange((ev)=>{if(ev==='PASSWORD_RECOVERY'&&!S.ui.pwKind){S.ui.pwKind='recovery'}if(ev==='SIGNED_OUT'&&S.session){S.session=null;S.view='landing';render(true)}})}
  try{if(await DB.auth.hasSession()){await boot()}}catch(e){S.ui.lerr=e.message}
  S.booting=false;
  if(S.session){if(hashType==='invite'||hashType==='recovery'){S.ui.pwKind=hashType;S.view='setpw'}else if(r.view==='home'||r.view==='landing'||r.view==='login'||r.view==='join'||r.view==='adminlogin')routeAfterLogin();else if(r.view!=='register')routeAfterLogin();else S.view='register'}
  else if(hashType==='invite'||hashType==='recovery'){S.ui.pwKind=hashType;S.view='setpw'}
  else S.view=r.view;
  if(!S.session&&S.view==='register'){await openRefPage(r.code,r.course,r.res);return}
  if(S.session&&r.view==='register'){await openRefPage(r.code,r.course,r.res);return}
  if(r.view==='login'&&!S.session&&/type=signup/.test(location.hash||''))S.ui.notice='Email confirmed. Log in to choose your partner category.';
  render(true);
}
if(!window.__NO_AUTO_INIT)appInit();
</script>
